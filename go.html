
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل...</title>
    <!-- استايلات لمحاكاة شكل تويتر -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .preview-card {
            background-color: #15202b;
            border: 1px solid #38444d;
            border-radius: 16px;
            overflow: hidden;
            max-width: 600px;
            width: 95%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .preview-card:hover { transform: scale(1.02); }
        .card-image {
            width: 100%;
            height: 300px;
            background-size: cover;
            background-position: center;
            background-color: #333;
        }
        .card-content { padding: 15px; }
        .card-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; color: #fff; }
        .card-desc { font-size: 0.9rem; color: #8899a6; }
        .loading-bar { width: 100%; height: 4px; background: #1da1f2; position: fixed; top: 0; left: 0; animation: load 2s infinite; }
        @keyframes load { 0% { width: 0; } 100% { width: 100%; } }
    </style>
</head>
<body>

    <div class="loading-bar"></div>

    <!-- شكل الكارد الذي سيظهر للمستخدم قبل التحويل -->
    <div class="preview-card" id="cardClick" onclick="goToLink()">
        <div class="card-image" id="imgDisplay"></div>
        <div class="card-content">
            <div class="card-title" id="titleDisplay">جاري تحميل الرابط...</div>
            <div class="card-desc" id="descDisplay">يرجى الانتظار قليلاً</div>
            <div class="text-muted mt-2" style="font-size: 0.8rem">twitter.com</div>
        </div>
    </div>

    <script>
        // ==========================================
        //  إعدادات أدستيرا (Adsterra Settings)
        // ==========================================
        
        // ضع رابط الدايركت لينك الخاص بك هنا بين علامتي التنصيص
        const ADSTERRA_DIRECT_LINK = "https://actingprofessionshiny.com/apd3i9w8cf?key=1ca491697c381fe5291aaf85e43c7ec0"; 
        
        // هل تريد التحويل التلقائي؟ (true = نعم، false = لا، ينتظر الضغط)
        const AUTO_REDIRECT = true; 
        
        // وقت الانتظار قبل التحويل التلقائي (بالملي ثانية) - 2000 تعني ثانيتين
        const REDIRECT_DELAY = 2500;

        // ==========================================

        // دالة جلب البيانات من الرابط
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const targetUrl = getQueryParam('u');
        const title = getQueryParam('t');
        const desc = getQueryParam('d');
        const img = getQueryParam('i');

        // عرض البيانات في الصفحة
        if (title) {
            document.title = title;
            document.getElementById('titleDisplay').innerText = title;
        }
        if (desc) document.getElementById('descDisplay').innerText = desc;
        if (img) document.getElementById('imgDisplay').style.backgroundImage = `url('${img}')`;

        // منطق التحويل (Adsterra Logic)
        function goToLink() {
            if (!targetUrl) return;

            // السيناريو: فتح الإعلان في نفس النافذة وفتح الرابط الأصلي في نافذة جديدة
            // أو العكس، حسب سياسة أدستيرا.
            
            // الطريقة الأكثر ربحاً (فتح الإعلان وتحويل المستخدم):
            // 1. فتح الإعلان
            window.location.href = ADSTERRA_DIRECT_LINK;
            
            // ملاحظة: بما أننا غادرنا الصفحة للإعلان، لن نستطيع فتح الرابط الأصلي بسهولة
            // إلا إذا استخدمنا window.open للإعلان.
            
            // حل بديل ذكي: 
            // فتح الرابط الأصلي في تبويب جديد فوراً، وتحويل الصفحة الحالية للإعلان
            setTimeout(() => {
                 window.open(targetUrl, '_blank');
            }, 100);
        }

        // التحويل التلقائي عند تحميل الصفحة
        if (AUTO_REDIRECT && targetUrl) {
            setTimeout(goToLink, REDIRECT_DELAY);
        }
    </script>
</body>
</html>
