<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري تجهيز الرابط...</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f8f9fa;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.card-box {
    max-width: 500px;
    width: 95%;
    border-radius: 15px;
    overflow: hidden;
}

.preview-img {
    height: 250px;
    background-size: cover;
    background-position: center;
    background-color: #ddd;
}

.countdown {
    font-size: 1.2rem;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card shadow card-box">
    <div id="imgDisplay" class="preview-img"></div>
    <div class="p-3 text-center">
        <h5 id="titleDisplay">جاري تحميل...</h5>
        <p id="descDisplay" class="text-muted"></p>

        <div class="countdown mb-3">
            سيتم تفعيل الزر خلال <span id="timer">5</span> ثواني
        </div>

        <button id="goBtn" class="btn btn-primary w-100" disabled>
            متابعة إلى الرابط
        </button>
    </div>
</div>

<script>
function getParam(param) {
    const params = new URLSearchParams(window.location.search);
    return params.get(param);
}

const targetUrl = getParam('u');
const title = getParam('t');
const desc = getParam('d');
const img = getParam('i');

if(title) {
    document.title = title;
    document.getElementById("titleDisplay").innerText = title;
}

if(desc) document.getElementById("descDisplay").innerText = desc;
if(img) document.getElementById("imgDisplay").style.backgroundImage = `url('${img}')`;

let seconds = 5;
const timerEl = document.getElementById("timer");
const btn = document.getElementById("goBtn");

const countdown = setInterval(() => {
    seconds--;
    timerEl.innerText = seconds;

    if(seconds <= 0) {
        clearInterval(countdown);
        btn.disabled = false;
        timerEl.parentElement.innerHTML = "يمكنك الآن المتابعة";
    }
}, 1000);

btn.addEventListener("click", () => {
    if(targetUrl) {
        window.location.href = targetUrl;
    }
});
</script>

</body>
</html>
