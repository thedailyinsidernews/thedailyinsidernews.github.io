<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحويل...</title>
<style>
body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
.card { background: #15202b; border-radius: 16px; overflow: hidden; max-width: 600px; width: 90%; cursor: pointer; }
.card img { width: 100%; height: 300px; object-fit: cover; }
.card-content { padding: 15px; }
.card-title { font-weight: bold; font-size: 1.1rem; color: #fff; margin-bottom: 5px; }
.card-desc { font-size: 0.9rem; color: #8899a6; }
</style>
</head>
<body>

<div class="card" id="cardClick">
    <img id="imgDisplay" src="">
    <div class="card-content">
        <div class="card-title" id="titleDisplay">جاري التحميل...</div>
        <div class="card-desc" id="descDisplay">يرجى الانتظار قليلاً</div>
        <div style="font-size: 0.8rem; color: #8899a6">thedailyinsidernews.is-a.software</div>
    </div>
</div>

<script>
const AD_LINK = "https://actingprofessionshiny.com/apd3i9w8cf?key=1ca491697c381fe5291aaf85e43c7ec0";

function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

const shortUrl = getQueryParam("id");
const title = getQueryParam("t") || "جاري التحويل...";
const desc = getQueryParam("d") || "";
const img = getQueryParam("i") || "";

document.getElementById("titleDisplay").innerText = title;
document.getElementById("descDisplay").innerText = desc;
document.getElementById("imgDisplay").src = img;

function redirect() {
    window.location.href = AD_LINK; // فتح الإعلان أولاً
    setTimeout(() => { window.open(shortUrl, "_blank"); }, 500); // فتح الرابط الأصلي في تبويب جديد بعد 0.5 ثانية
}

setTimeout(redirect, 2500); // التحويل التلقائي بعد 2.5 ثانية
document.getElementById("cardClick").onclick = redirect;
</script>

</body>
</html>
