<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HotTrends | Discover What’s Buzzing Now!</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Open Graph Meta Tags -->
<meta property="og:type" content="website" />
<meta property="og:title" content="HotTrends - Discover What’s Buzzing Now!" />
<meta property="og:description" content="Stay ahead with the freshest, hottest trends curated just for you." />
<meta property="og:image" content="https://via.placeholder.com/1200x630.png?text=HotTrends" />
<meta property="og:url" content="https://hottrends.is-a.software/" />
<meta property="og:site_name" content="HotTrends" />

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    margin: 0;
    padding: 20px;
    color: #fff;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    color: #fff;
    margin-bottom: 5px;
    font-weight: 700;
    font-size: 2.8rem;
  }
  p.subtitle {
    text-align: center;
    color: #c0cce3;
    margin-bottom: 20px;
    font-weight: 400;
    font-size: 1.3rem;
    font-style: italic;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    color: #2a5298;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card:hover {
    transform: translateY(-7px);
    box-shadow: 0 14px 38px rgba(0,0,0,0.3);
  }
  .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
  }
  .card-content {
    padding: 18px 20px 12px 20px;
    flex-grow: 1;
  }
  .card-content h3 {
    margin-bottom: 10px;
    font-weight: 700;
  }
  .card-content p {
    font-size: 14px;
    margin-bottom: 14px;
    color: #555a7c;
    min-height: 56px;
  }
  .btn {
    display: inline-block;
    padding: 10px 18px;
    background: #2a5298;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.3s ease;
    margin-bottom: 15px;
  }
  .btn:hover {
    background: #1e3c72;
  }
  .share-buttons {
    padding: 0 20px 20px 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .share-buttons a {
    flex: 1 1 45px;
    text-align: center;
    color: white;
    border-radius: 6px;
    padding: 8px 0;
    font-size: 14px;
    text-decoration: none;
    transition: background 0.3s ease;
    font-weight: 700;
  }
  .share-buttons a.facebook {
    background: #4267B2;
  }
  .share-buttons a.x {
    background: #1DA1F2;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 900;
    font-size: 18px;
  }
  .share-buttons a.linkedin {
    background: #0077B5;
  }
  .share-buttons a.whatsapp {
    background: #25D366;
  }
  .share-buttons a:hover {
    filter: brightness(0.85);
  }
  #loading, #message {
    text-align: center;
    margin-top: 30px;
    font-size: 16px;
    color: #c0cce3;
  }
  #message.error {
    color: #ff6b6b;
  }
</style>
</head>
<body>

<h1>🔥 HotTrends</h1>
<p class="subtitle">Discover What’s Buzzing Now!</p>

<div id="posts" class="grid"></div>
<div id="loading">Loading posts...</div>
<div id="message"></div>

<script>
  var supabase = window.supabase.createClient(
    "https://nnynvpjudlcuejcuvszx.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueW52cGp1ZGxjdWVqY3V2c3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMjU1MDUsImV4cCI6MjA4NjkwMTUwNX0.1lRjMTGaXJUoqum_pS9TyzDG9w-fwToO61VcC8yLYxg"
  );

  function urlEncode(str) {
    return encodeURIComponent(str);
  }

  async function loadPosts() {
    const { data, error } = await supabase
      .from("links")
      .select("*")
      .order("id", { ascending: false })
      .limit(9);

    document.getElementById("loading").style.display = "none";

    const messageEl = document.getElementById("message");

    if (error) {
      messageEl.innerHTML = "<div class='error'>" + error.message + "</div>";
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      messageEl.textContent = "No posts found.";
      return;
    }

    const container = document.getElementById("posts");
    container.innerHTML = ""; // تنظيف المحتوى قبل الإضافة

    data.forEach(post => {
      const postUrl = `https://hottrends.is-a.software/${post.id}`;
      const encodedUrl = urlEncode(postUrl);
      const encodedTitle = urlEncode(post.title);

      container.innerHTML += `
        <div class="card">
          <img src="${post.image || 'https://via.placeholder.com/400x160?text=No+Image'}" alt="${post.title}" />
          <div class="card-content">
            <h3>${post.title}</h3>
            <p>${post.description || ''}</p>
            <a href="${postUrl}" class="btn" target="_blank" rel="noopener noreferrer">Read More</a>
          </div>
          <div class="share-buttons">
            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}" target="_blank" rel="noopener noreferrer" title="Share on Facebook" class="facebook">Facebook</a>
            <a href="https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}" target="_blank" rel="noopener noreferrer" title="Share on X" class="x">X</a>
            <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}" target="_blank" rel="noopener noreferrer" title="Share on LinkedIn" class="linkedin">LinkedIn</a>
            <a href="https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}" target="_blank" rel="noopener noreferrer" title="Share on WhatsApp" class="whatsapp">WhatsApp</a>
          </div>
        </div>
      `;
    });
  }

  loadPosts();
</script>

</body>
</html>
