<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Shortener Pro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* ===== Background ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== Glass Card ===== */
.card {
  backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  color: #fff;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  animation: fadeIn 0.6s ease-in-out;
}

h4 {
  font-weight: 700;
  letter-spacing: 1px;
}

/* ===== Inputs ===== */
.form-control {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  border-radius: 12px;
  padding: 12px;
}

.form-control::placeholder {
  color: rgba(255,255,255,0.6);
}

.form-control:focus {
  background: rgba(255,255,255,0.15);
  border-color: #00c6ff;
  box-shadow: 0 0 0 3px rgba(0,198,255,0.3);
  color: #fff;
}

/* ===== Button ===== */
.btn-main {
  background: linear-gradient(45deg, #00c6ff, #0072ff);
  border: none;
  border-radius: 12px;
  font-weight: 600;
  padding: 12px;
  transition: 0.3s ease;
}

.btn-main:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(0,114,255,0.4);
}

/* ===== Result Box ===== */
#resultArea {
  background: rgba(255,255,255,0.08);
  padding: 15px;
  border-radius: 15px;
  margin-top: 20px;
}

#finalLink {
  text-align: center;
  font-weight: 600;
}

/* ===== Share Buttons ===== */
.share-btn {
  display: inline-block;
  padding: 8px 14px;
  margin: 5px;
  border-radius: 10px;
  font-weight: 600;
  color: #fff;
  text-decoration: none;
  transition: 0.3s;
}

.share-btn:hover {
  transform: scale(1.1);
}

.bg-wa { background: #25D366; }
.bg-fb { background: #1877F2; }
.bg-x  { background: #000; }
.bg-tg { background: #0088cc; }

/* ===== Animation ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media(max-width: 768px){
  .card { padding: 20px !important; }
}
</style>
</head>

<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card p-4">

        <h4 class="text-center mb-4">🚀 Link Shortener Pro</h4>

        <div class="mb-3">
          <label>Original URL *</label>
          <input type="url" id="targetUrl" class="form-control" placeholder="https://example.com">
        </div>

        <div class="mb-3">
          <label>Title *</label>
          <input type="text" id="linkTitle" class="form-control">
        </div>

        <div class="mb-3">
          <label>Description</label>
          <textarea id="linkDesc" class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label>Image URL</label>
          <input type="url" id="linkImg" class="form-control">
        </div>

        <button onclick="generateLink()" class="btn btn-main w-100" id="createBtn">
          Generate Short Link
        </button>

        <!-- Result -->
        <div class="d-none" id="resultArea">
          <hr style="border-color: rgba(255,255,255,0.2);">
          <label class="text-info">Short link generated successfully:</label>

          <div class="input-group mb-3">
            <input type="text" id="finalLink" class="form-control" readonly>
            <button class="btn btn-light" onclick="copyLink()">Copy</button>
          </div>

          <div class="text-center">
            <a id="shareWa" target="_blank" class="share-btn bg-wa">WA</a>
            <a id="shareFb" target="_blank" class="share-btn bg-fb">FB</a>
            <a id="shareX" target="_blank" class="share-btn bg-x">X</a>
            <a id="shareTg" target="_blank" class="share-btn bg-tg">TG</a>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="/script.js"></script>
</body>
</html>
