<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Shortener</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="/styles.css">

  <!-- External JS -->
  <script src="/script.js" defer></script>

</head>
<body>

  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card p-4 shadow">
          <h4 class="text-center mb-4">🚀 Link Shortener System</h4>

          <div class="mb-3">
            <label>Original URL *</label>
            <input type="url" id="targetUrl" class="form-control" placeholder="https://example.com">
          </div>

          <div class="mb-3">
            <label>Title *</label>
            <input type="text" id="linkTitle" class="form-control">
          </div>

          <div class="mb-3">
            <label>Description</label>
            <textarea id="linkDesc" class="form-control"></textarea>
          </div>

          <div class="mb-3">
            <label>Image URL</label>
            <input type="url" id="linkImg" class="form-control">
          </div>

          <button onclick="generateLink()" class="btn btn-main w-100 py-2" id="createBtn">
            Generate Short Link
          </button>

          <!-- Result Area -->
          <div class="mt-4 d-none" id="resultArea">
            <hr>
            <label class="text-success">Short link generated successfully:</label>

            <div class="input-group mb-3">
              <input type="text" id="finalLink" class="form-control text-center" readonly>
              <button class="btn btn-secondary" onclick="copyLink()">Copy</button>
            </div>

            <div class="text-center">
              <a id="shareWa" target="_blank" class="share-btn bg-wa">WA</a>
              <a id="shareFb" target="_blank" class="share-btn bg-fb">FB</a>
              <a id="shareX" target="_blank" class="share-btn bg-x">X</a>
              <a id="shareTg" target="_blank" class="share-btn bg-tg">TG</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
