<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HotTrends | Latest Topics</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
  color: #333;
}
h1 {
  text-align: center;
  color: #2a5298;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 30px;
}
.card {
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  transition: transform 0.2s;
}
.card:hover {
  transform: translateY(-5px);
}
.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}
.card-content {
  padding: 15px;
}
.card-content h3 {
  color: #2a5298;
  margin-bottom: 10px;
}
.card-content p {
  font-size: 14px;
  margin-bottom: 12px;
}
.btn {
  display: inline-block;
  padding: 8px 15px;
  background: #2a5298;
  color: #fff;
  text-decoration: none;
  border-radius: 6px;
  font-size: 14px;
}
.loading,
.error {
  text-align: center;
  margin-top: 30px;
  font-size: 16px;
  color: #555;
}
.error {
  color: red;
}
</style>
</head>
<body>

<h1>🔥 HotTrends</h1>

<div id="posts" class="grid"></div>
<div id="loading" class="loading">Loading posts...</div>
<div id="message"></div>

<script>
var supabase = window.supabase.createClient(
  "https://nnynvpjudlcuejcuvszx.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueW52cGp1ZGxjdWVqY3V2c3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMjU1MDUsImV4cCI6MjA4NjkwMTUwNX0.1lRjMTGaXJUoqum_pS9TyzDG9w-fwToO61VcC8yLYxg"
);

async function loadPosts() {
  const { data, error } = await supabase
    .from("links")              // اسم جدولك الصحيح
    .select("*")
    .order("id", { ascending: false })  // يمكن تعديل حسب الحاجة
    .limit(9);

  document.getElementById("loading").style.display = "none";

  if (error) {
    document.getElementById("message").innerHTML = "<div class='error'>" + error.message + "</div>";
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    document.getElementById("message").innerText = "No posts found.";
    return;
  }

  const container = document.getElementById("posts");

  data.forEach(post => {
    container.innerHTML += `
      <div class="card">
        <img src="${post.image || 'https://via.placeholder.com/400x150'}" alt="Image" />
        <div class="card-content">
          <h3>${post.title}</h3>
          <p>${post.description || ''}</p>
          <a href="#" class="btn">Read More</a>
        </div>
      </div>
    `;
  });
}

loadPosts();
</script>

</body>
</html>
