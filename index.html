<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotTrends | Latest Topics</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-top:30px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.error{
  color:red;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>HotTrends</h1>

<div id="posts" class="grid"></div>
<div id="message"></div>

<script>

const SUPABASE_URL = "https://nnynvpjudlcuejcuvszx.supabase.co";
const SUPABASE_ANON_KEY = "ضع_هنا_المفتاح_العام";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadPosts() {

  const { data, error } = await supabase
    .from("posts")   // 👈 تأكدي أن اسم الجدول صحيح
    .select("*");

  const message = document.getElementById("message");

  if (error) {
    message.innerHTML = "<div class='error'>" + error.message + "</div>";
    console.error(error);
    return;
  }

  if (!data.length) {
    message.innerHTML = "No posts found.";
    return;
  }

  const container = document.getElementById("posts");

  data.forEach(post => {
    container.innerHTML += `
      <div class="card">
        <h3>${post.title}</h3>
        <p>${post.excerpt || ""}</p>
      </div>
    `;
  });
}

loadPosts();

</script>

</body>
</html>
