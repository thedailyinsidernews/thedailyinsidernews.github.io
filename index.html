<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منشئ الروابط المختصرة</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f4f6f9; font-family: Tahoma, sans-serif; }
.card { border-radius: 15px; padding: 20px; margin-top: 50px; }
.btn-main { background: #0d6efd; border: none; }
.btn-main:hover { background: #0b5ed7; color: #fff; }
.share-btn { width: 45px; height: 45px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: white; margin: 5px; font-weight: bold; text-decoration: none; }
.bg-wa { background: #25D366; } .bg-fb { background: #1877F2; } .bg-x { background: #000; } .bg-tg { background: #0088cc; }
</style>
</head>
<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-md-7">
<div class="card shadow">

<h4 class="text-center mb-4">🚀 منشئ الروابط المختصرة</h4>

<div class="mb-3">
<label>الرابط الأصلي *</label>
<input type="url" id="targetUrl" class="form-control" placeholder="https://example.com">
</div>

<div class="mb-3">
<label>العنوان *</label>
<input type="text" id="linkTitle" class="form-control">
</div>

<div class="mb-3">
<label>الوصف</label>
<textarea id="linkDesc" class="form-control"></textarea>
</div>

<div class="mb-3">
<label>رابط الصورة</label>
<input type="url" id="linkImg" class="form-control">
</div>

<button onclick="generateLink()" class="btn btn-main w-100 py-2" id="createBtn">
إنشاء الرابط المختصر
</button>

<div class="mt-4 d-none" id="resultArea">
<hr>
<label class="text-success">تم إنشاء الرابط بنجاح:</label>
<div class="input-group mb-3">
<input type="text" id="finalLink" class="form-control text-center" readonly>
<button class="btn btn-secondary" onclick="copyLink()">نسخ</button>
</div>
<div class="text-center">
<a id="shareWa" target="_blank" class="share-btn bg-wa">WA</a>
<a id="shareFb" target="_blank" class="share-btn bg-fb">FB</a>
<a id="shareX" target="_blank" class="share-btn bg-x">X</a>
<a id="shareTg" target="_blank" class="share-btn bg-tg">TG</a>
</div>
</div>

</div>
</div>
</div>
</div>

<script>
const API_URL = "https://qykppopnwedvjylcetar.supabase.co/functions/v1/create";
const AD_LINK = "https://actingprofessionshiny.com/apd3i9w8cf?key=1ca491697c381fe5291aaf85e43c7ec0";

function isValidURL(url) {
    try { new URL(url); return true } catch { return false }
}

async function generateLink() {
    const target = document.getElementById('targetUrl').value.trim();
    const title = document.getElementById('linkTitle').value.trim();
    const desc = document.getElementById('linkDesc').value.trim();
    const img = document.getElementById('linkImg').value.trim();
    if (!target || !title) { alert("يرجى ملء الحقول المطلوبة"); return; }
    if (!isValidURL(target)) { alert("الرابط الأصلي غير صالح"); return; }

    const btn = document.getElementById("createBtn");
    btn.disabled = true; btn.innerHTML = "جاري الإنشاء...";

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, description: desc, image: img, target })
        });

        if (!res.ok) { const text = await res.text(); alert("خطأ من السيرفر: " + text); return; }

        const data = await res.json();
        // رابط إعادة التوجيه الجديد
        const redirectUrl = `redirect.html?id=${encodeURIComponent(data.shortUrl)}&t=${encodeURIComponent(title)}&d=${encodeURIComponent(desc)}&i=${encodeURIComponent(img)}`;
        document.getElementById("finalLink").value = redirectUrl;
        document.getElementById("resultArea").classList.remove("d-none");
        setupSharing(redirectUrl, title);

    } catch (e) {
        alert("حدث خطأ أثناء الإنشاء: " + e.message);
    }

    btn.disabled = false;
    btn.innerHTML = "إنشاء الرابط المختصر";
}

function copyLink() {
    navigator.clipboard.writeText(document.getElementById("finalLink").value)
        .then(()=> alert("تم النسخ بنجاح ✅"));
}

function setupSharing(url, title) {
    document.getElementById("shareWa").href = `https://api.whatsapp.com/send?text=${encodeURIComponent(title+" "+url)}`;
    document.getElementById("shareFb").href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
    document.getElementById("shareX").href = `https://x.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`;
    document.getElementById("shareTg").href = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
}
</script>

</body>
</html>
