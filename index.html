<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HotTrends | Latest Topics</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    margin: 0;
    padding: 20px;
    color: #fff;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    color: #fff;
    margin-bottom: 5px;
    font-weight: 700;
    font-size: 2.5rem;
  }
  p.subtitle {
    text-align: center;
    color: #c0cce3;
    margin-bottom: 30px;
    font-weight: 300;
    font-size: 1.2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    color: #2a5298;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  }
  .card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
  }
  .card-content {
    padding: 20px;
  }
  .card-content h3 {
    margin-bottom: 12px;
    font-weight: 700;
  }
  .card-content p {
    font-size: 14px;
    margin-bottom: 18px;
    color: #555a7c;
    min-height: 56px; /* To keep cards uniform height */
  }
  .btn {
    display: inline-block;
    padding: 10px 18px;
    background: #2a5298;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.3s ease;
  }
  .btn:hover {
    background: #1e3c72;
  }
  #loading, #message {
    text-align: center;
    margin-top: 30px;
    font-size: 16px;
    color: #c0cce3;
  }
  #message.error {
    color: #ff6b6b;
  }
</style>
</head>
<body>

<h1>🔥 HotTrends</h1>
<p class="subtitle">Latest Topics from Supabase</p>

<div id="posts" class="grid"></div>
<div id="loading">Loading posts...</div>
<div id="message"></div>

<script>
  var supabase = window.supabase.createClient(
    "https://nnynvpjudlcuejcuvszx.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueW52cGp1ZGxjdWVqY3V2c3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMjU1MDUsImV4cCI6MjA4NjkwMTUwNX0.1lRjMTGaXJUoqum_pS9TyzDG9w-fwToO61VcC8yLYxg"
  );

  async function loadPosts() {
    const { data, error } = await supabase
      .from("links")
      .select("*")
      .order("id", { ascending: false })
      .limit(9);

    document.getElementById("loading").style.display = "none";

    const messageEl = document.getElementById("message");

    if (error) {
      messageEl.innerHTML = "<div class='error'>" + error.message + "</div>";
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      messageEl.textContent = "No posts found.";
      return;
    }

    const container = document.getElementById("posts");
    container.innerHTML = ""; // تنظيف المحتوى قبل الإضافة

    data.forEach(post => {
      container.innerHTML += `
        <div class="card">
          <img src="${post.image || 'https://via.placeholder.com/400x160?text=No+Image'}" alt="${post.title}" />
          <div class="card-content">
            <h3>${post.title}</h3>
            <p>${post.description || ''}</p>
            <a href="https://hottrends.is-a.software/${post.id}" class="btn" target="_blank" rel="noopener noreferrer">Read More</a>
          </div>
        </div>
      `;
    });
  }

  loadPosts();
</script>

</body>
</html>
