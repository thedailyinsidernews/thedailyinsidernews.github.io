<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotTrends | Access Article</title>

<!-- إعداد أيقونة الموقع -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">

<!-- خطوط جوجل (Poppins) ومكتبة الأيقونات (FontAwesome) -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* إعدادات الصفحة والخلفية المتحركة */
  body { 
    font-family: 'Poppins', sans-serif; 
    margin: 0; 
    height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    color: #fff;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1e3c72);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    padding: 20px;
    box-sizing: border-box;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* تصميم البطاقة بتأثير الزجاج (Glassmorphism) */
  .card { 
    background: rgba(255, 255, 255, 0.95); 
    backdrop-filter: blur(10px);
    color: #333; 
    padding: 30px 25px; 
    border-radius: 20px; 
    box-shadow: 0 20px 50px rgba(0,0,0,0.3); 
    text-align: center; 
    max-width: 450px; 
    width: 100%; 
    transform: translateY(30px);
    opacity: 0;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes slideUp {
    to { transform: translateY(0); opacity: 1; }
  }

  /* حاوية الصورة مع وسام التريند */
  .image-container {
    position: relative;
    margin-bottom: 20px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }

  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #ff4757;
    color: white;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    z-index: 2;
    box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .card img { 
    width: 100%; 
    height: 220px; 
    object-fit: cover; 
    display: block; 
    transition: transform 0.5s ease;
  }
  
  .image-container:hover img {
    transform: scale(1.05);
  }

  /* النصوص */
  h2 {
    margin: 0 0 10px 0;
    font-size: 22px;
    font-weight: 700;
    color: #1e3c72;
    line-height: 1.3;
  }

  p {
    font-size: 14px;
    color: #666;
    margin-bottom: 25px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* زر المتابعة التفاعلي (ينبض) */
  .btn { 
    display: flex; 
    justify-content: center;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 16px 0; 
    background: linear-gradient(135deg, #1e3c72, #2a5298); 
    color: #fff; 
    text-decoration: none; 
    border-radius: 12px; 
    font-size: 16px;
    font-weight: 700; 
    cursor: pointer; 
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(42, 82, 152, 0.4);
    animation: pulse 2s infinite;
    box-sizing: border-box;
  }

  .btn:hover { 
    background: linear-gradient(135deg, #2a5298, #1e3c72); 
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(42, 82, 152, 0.6);
    animation: none; /* إيقاف النبض عند التمرير */
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 8px 20px rgba(42, 82, 152, 0.4); }
    50% { transform: scale(1.03); box-shadow: 0 12px 25px rgba(42, 82, 152, 0.6); }
    100% { transform: scale(1); box-shadow: 0 8px 20px rgba(42, 82, 152, 0.4); }
  }

  /* الفوتر */
  .footer { 
    margin-top: 20px; 
    font-size: 13px; 
    color: #999; 
    font-weight: 500;
  }
  .footer span { color: #2a5298; font-weight: 700; }
  
  .secure-text {
    font-size: 11px;
    color: #28a745;
    margin-bottom: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    font-weight: 600;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const params = new URLSearchParams(window.location.search);
  
  // فك تشفير النصوص من الرابط
  const target = params.get("target") ? decodeURIComponent(params.get("target")) : "#";
  const title = params.get("title") ? decodeURIComponent(params.get("title")) : "HotTrends - Trending Article";
  const desc = params.get("desc") ? decodeURIComponent(params.get("desc")) : "Read the latest trending article now. Click the button below to access the full story safely.";
  const image = params.get("image") ? decodeURIComponent(params.get("image")) : "https://via.placeholder.com/600x300?text=Trending+Now";

  // تحديث المحتوى
  document.getElementById("pageTitle").textContent = title;
  document.getElementById("pageDesc").textContent = desc;
  
  const imgEl = document.getElementById("pageImage");
  imgEl.src = image;
  // في حال كانت الصورة معطوبة، يتم وضع صورة بديلة
  imgEl.onerror = function() {
    this.src = "https://via.placeholder.com/600x300?text=Trending+Now";
  };

  const adUrl = "https://actingprofessionshiny.com/dtc1yaw0b4?key=dedc6b5d3fa1c097637ca6ad508c057a";
  const continueBtn = document.getElementById("continueBtn");

  // تفعيل الزر عند الضغط
  continueBtn.addEventListener("click", function() {
    // تغيير شكل الزر لإعطاء إيحاء بالتحميل لثوانٍ
    continueBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Loading secure link...';
    continueBtn.style.animation = "none";
    continueBtn.style.opacity = "0.8";
    continueBtn.style.pointerEvents = "none"; // منع الضغط مرتين

    // فتح الإعلان في نافذة جديدة
    window.open(adUrl, "_blank");
    
    // تحويل الزائر للمقال المطلوب في نفس النافذة بعد ثانية واحدة
    setTimeout(() => { 
      window.location.replace(target); 
    }, 1000);
  });
});
</script>
</head>

<body>
<div class="card">
  
  <div class="image-container">
    <div class="badge"><i class="fas fa-fire"></i> Trending</div>
    <img id="pageImage" alt="Article Preview" src="">
  </div>

  <h2 id="pageTitle">Loading Title...</h2>
  <p id="pageDesc">Please wait while we prepare the article description...</p>
  
  <div class="secure-text">
    <i class="fas fa-shield-check"></i> 100% Safe & Secure Link
  </div>

  <div class="btn" id="continueBtn">
    Continue to Article <i class="fas fa-arrow-right"></i>
  </div>
  
  <div class="footer">Powered by <span>🔥 HotTrends</span></div>
</div>
</body>
</html>
