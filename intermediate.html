<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotTrends | Trending Now</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#141e30,#243b55);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  color:#fff;
}

.card{
  background:#fff;
  color:#333;
  padding:30px;
  border-radius:18px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  text-align:center;
  max-width:420px;
  width:90%;
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

.card img{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:15px;
}

.countdown{
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
  color:#243b55;
}

.progress-bar{
  width:100%;
  height:8px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin-top:15px;
}

.progress{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#1e3c72,#2a5298);
  transition:width 1s linear;
}

.btn{
  display:inline-block;
  margin-top:18px;
  padding:12px 20px;
  background:#243b55;
  color:#fff;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#141e30;
  transform:scale(1.05);
}

.footer{
  margin-top:15px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">
  <img src="https://hottrends.is-a.software/preview.jpg" alt="Preview">
  <h2>🔥 Trending Content Awaits!</h2>
  <p>We’re preparing your content. Please wait a few seconds...</p>

  <div class="countdown">Redirecting in <span id="seconds">5</span>s</div>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>

  <div class="btn" id="continueBtn">Continue Now</div>

  <div class="footer">
    Powered by HotTrends
  </div>
</div>

<script>
const target = new URLSearchParams(window.location.search).get("target");
const adUrl = "https://actingprofessionshiny.com/dtc1yaw0b4?key=dedc6b5d3fa1c097637ca6ad508c057a";

if(!target){
  document.body.innerHTML="<h2 style='color:white'>❌ No target URL provided.</h2>";
}

let seconds = 5;
const secondsEl = document.getElementById("seconds");
const progress = document.getElementById("progress");
const btn = document.getElementById("continueBtn");

let interval = setInterval(()=>{
  seconds--;
  secondsEl.textContent = seconds;
  progress.style.width = ((5-seconds)*20)+"%";

  if(seconds <= 0){
    clearInterval(interval);
    window.location.href = target;
  }
},1000);

btn.addEventListener("click", ()=>{
  window.open(adUrl,"_blank");
  setTimeout(()=>{
    window.location.href = target;
  },500);
});
</script>

</body>
</html>
