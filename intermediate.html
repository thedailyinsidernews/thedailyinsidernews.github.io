<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotTrends | Trending Now</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#1e3c72,#2a5298);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  color:#fff;
}

.card{
  background:#fff;
  color:#333;
  padding:30px;
  border-radius:15px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  text-align:center;
  max-width:420px;
  width:90%;
  animation:fadeIn 0.8s ease-in-out;
}

h2{
  margin-bottom:10px;
}

.countdown{
  font-size:18px;
  font-weight:bold;
  color:#2a5298;
  margin:15px 0;
}

.loader{
  border:4px solid #eee;
  border-top:4px solid #2a5298;
  border-radius:50%;
  width:35px;
  height:35px;
  animation:spin 1s linear infinite;
  margin:20px auto;
}

.btn{
  display:inline-block;
  margin-top:15px;
  padding:12px 22px;
  background:#2a5298;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  animation:pulse 1.5s infinite;
}

.btn:hover{
  background:#1e3c72;
  transform:scale(1.05);
}

.footer{
  margin-top:15px;
  font-size:12px;
  color:#888;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function(){

  const target = "https://your-final-destination.com";
  const adUrl = "https://actingprofessionshiny.com/dtc1yaw0b4?key=dedc6b5d3fa1c097637ca6ad508c057a";

  let seconds = 5;
  const countdownEl = document.getElementById("count");

  const timer = setInterval(()=>{
    seconds--;
    countdownEl.textContent = seconds;

    if(seconds <= 0){
      clearInterval(timer);
      window.location.href = target;
    }
  },1000);

  document.getElementById("continueBtn").addEventListener("click", function(){
    window.open(adUrl, "_blank");
    window.location.href = target;
  });

});
</script>

</head>
<body>

<div class="card">
  <h2>🔥 Trending Content is Ready!</h2>
  <p>We found something exciting for you.</p>

  <div class="countdown">
    Redirecting in <span id="count">5</span> seconds...
  </div>

  <div class="loader"></div>

  <div class="btn" id="continueBtn">
    Access Now 🚀
  </div>

  <div class="footer">
    Powered by HotTrends
  </div>
</div>

</body>
</html>
