<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotTrends | Redirecting...</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9fafb;
    margin: 0;
    padding: 20px;
  }
  .content {
    max-width: 800px;
    margin: auto;
    padding: 25px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }
  h1 {
    color: #2a5298;
    margin-bottom: 10px;
  }
  img {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 15px;
  }
  p {
    color: #555;
    font-size: 16px;
    line-height: 1.5;
  }
  .loader {
    border: 6px solid #eee;
    border-top: 6px solid #2a5298;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 30px auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .footer {
    text-align:center;
    font-size:12px;
    color:#888;
    margin-top:15px;
  }
</style>

</head>
<body>

<div class="content" id="articleContent">
  <h1 id="title">Loading article...</h1>
  <img id="articleImg" style="display:none;">
  <p id="bodyText"></p>
  <div class="loader" id="loader"></div>
</div>

<div class="footer">🔥 Powered by HotTrends</div>

<script>
  // تهيئة Supabase
  var supabase = window.supabase.createClient(
    "https://nnynvpjudlcuejcuvszx.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueW52cGp1ZGxjdWVqY3V2c3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMjU1MDUsImV4cCI6MjA4NjkwMTUwNX0.1lRjMTGaXJUoqum_pS9TyzDG9w-fwToO61VcC8yLYxg"
  );

  document.addEventListener("DOMContentLoaded", async function(){

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if(!id){
      document.getElementById("title").textContent = "Article not found";
      document.getElementById("loader").style.display = "none";
      return;
    }

    // جلب المقالة من Supabase
    const { data, error } = await supabase
      .from("links")
      .select("*")
      .eq("id", id)
      .single();

    if(error || !data) {
      document.getElementById("title").textContent = "Article not found";
      document.getElementById("loader").style.display = "none";
      return;
    }

    // عرض المقالة
    document.getElementById("title").textContent = data.title;

    if(data.image){
      const img = document.getElementById("articleImg");
      img.src = data.image;
      img.style.display = "block";
    }

    document.getElementById("bodyText").innerHTML = data.description || "";
    document.getElementById("loader").style.display = "none";

    // بعد 3 ثوانٍ ننتقل للإعلان
    setTimeout(function(){
      window.location.href = "https://actingprofessionshiny.com/dtc1yaw0b4?key=dedc6b5d3fa1c097637ca6ad508c057a";
    }, 3000);

  });
</script>

</body>
</html>
