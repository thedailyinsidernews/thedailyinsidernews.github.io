<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotTrends | Article</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9fafb;
    margin: 0;
    padding: 20px;
  }
  .content {
    max-width: 800px;
    margin: auto;
    padding: 25px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }
  h1 {
    color: #2a5298;
  }
  .loader {
    border: 6px solid #eee;
    border-top: 6px solid #2a5298;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 30px auto;
  }
  @keyframes spin { 0%{transform:rotate(0);}100%{transform:rotate(360deg);} }
  .footer {
    text-align:center;
    font-size:12px;
    color:#888;
    margin-top:15px;
  }
</style>

</head>
<body>

<div class="content" id="articleContent">
  <h1 id="title">Loading article...</h1>
  <p id="bodyText"></p>
  <div class="loader" id="loader"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if(!id){
    document.getElementById("title").textContent = "Article not found";
    document.getElementById("loader").style.display = "none";
    return;
  }

  // ** load your article from Supabase or API **
  // For example (dummy text):
  document.getElementById("title").textContent = "Here is your Article Title";
  document.getElementById("bodyText").innerHTML = `
    This is the content of the article with id: <b>${id}</b>.
    <br><br>
    <!-- load actual content using fetch/supabase -->
  `;

  // after delay redirect to ad
  setTimeout(function(){
    window.location.href = "https://actingprofessionshiny.com/dtc1yaw0b4?key=dedc6b5d3fa1c097637ca6ad508c057a";
  }, 2500); // 2.5s delay

});
</script>

<div class="footer">🔥 Powered by HotTrends</div>

</body>
</html>
