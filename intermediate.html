<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  
  <!-- Meta Tags for Social Media Preview -->
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="https://via.placeholder.com/400x200?text=No+Image">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="https://via.placeholder.com/400x200?text=No+Image">

  <link rel="stylesheet" href="styles.css">

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Get the 'target', 'title', 'desc', 'image' from query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const target = urlParams.get('target') || '#'; // Default to '#' if not found
      const title = urlParams.get('title') || 'Default Title';
      const description = urlParams.get('desc') || 'No description available';
      const image = urlParams.get('image') || 'https://via.placeholder.com/400x200?text=No+Image';

      // Update the Meta Tags dynamically
      document.querySelector('meta[property="og:title"]').setAttribute('content', title);
      document.querySelector('meta[property="og:description"]').setAttribute('content', description);
      document.querySelector('meta[property="og:image"]').setAttribute('content', image);

      document.querySelector('meta[name="twitter:title"]').setAttribute('content', title);
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', description);
      document.querySelector('meta[name="twitter:image"]').setAttribute('content', image);

      // Optional: Open advertisement in new tab (if you have an ad URL)
      const adUrl = "https://actingprofessionshiny.com/apd3i9w8cf?key=1ca491697c381fe5291aaf85e43c7ec0";
      window.open(adUrl, "_blank");

      // Redirect to the target after 1 second
      setTimeout(() => {
        window.location.href = target;
      }, 1000);
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="message">
      <h1>Redirecting...</h1>
      <p>We are redirecting you to the original link. Please wait...</p>
    </div>
  </div>
</body>
</html>
