<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Link Shortener</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #eef2f7, #e3eaf5);
    font-family: system-ui, -apple-system, sans-serif;
}

.card {
    border-radius: 18px;
    border: none;
}

.btn-main {
    background: linear-gradient(45deg, #0d6efd, #0b5ed7);
    border: none;
    font-weight: 600;
}

.btn-main:hover {
    opacity: .9;
}

.share-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-decoration: none;
    margin: 5px;
    font-size: 18px;
}

.bg-wa { background: #25D366; }
.bg-fb { background: #1877F2; }
.bg-tg { background: #0088cc; }
.bg-x { background: #000; }

</style>
</head>
<body>

<div class="container mt-5 mb-5">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card p-4 shadow">

<h4 class="text-center mb-4">🚀 Smart Link Shortener</h4>

<div class="mb-3">
<label>Original URL *</label>
<input type="url" id="targetUrl" class="form-control" placeholder="https://example.com">
</div>

<div class="mb-3">
<label>Title *</label>
<input type="text" id="linkTitle" class="form-control">
</div>

<div class="mb-3">
<label>Description</label>
<textarea id="linkDesc" class="form-control"></textarea>
</div>

<div class="mb-3">
<label>Image URL</label>
<input type="url" id="linkImg" class="form-control">
</div>

<button onclick="generateLink()" class="btn btn-main w-100 py-2" id="createBtn">
Create Short Link
</button>

<div class="mt-4 d-none" id="resultArea">
<hr>
<label class="text-success">Short link created successfully:</label>

<div class="input-group mb-3">
<input type="text" id="finalLink" class="form-control text-center" readonly>
<button class="btn btn-secondary" onclick="copyLink()">Copy</button>
</div>

<div class="text-center mb-3">
<a id="shareWa" target="_blank" class="share-btn bg-wa"><i class="fab fa-whatsapp"></i></a>
<a id="shareFb" target="_blank" class="share-btn bg-fb"><i class="fab fa-facebook-f"></i></a>
<a id="shareX" target="_blank" class="share-btn bg-x"><i class="fab fa-x-twitter"></i></a>
<a id="shareTg" target="_blank" class="share-btn bg-tg"><i class="fab fa-telegram"></i></a>
</div>

<button class="btn btn-outline-primary w-100" onclick="resetForm()">
Add Another Link
</button>

</div>
</div>
</div>
</div>
</div>

<script>
const API_URL = "https://nnynvpjudlcuejcuvszx.supabase.co/functions/v1/create";

function isValidURL(url) {
    try { new URL(url); return true; }
    catch { return false; }
}

async function generateLink() {

    const target = targetUrl.value.trim();
    const title = linkTitle.value.trim();
    const desc = linkDesc.value.trim();
    const img = linkImg.value.trim();

    if (!target || !title) {
        alert("Please fill required fields");
        return;
    }

    if (!isValidURL(target)) {
        alert("Invalid URL");
        return;
    }

    createBtn.innerHTML = "Creating...";
    createBtn.disabled = true;

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                title,
                description: desc,
                image: img,
                target
            })
        });

        if (!response.ok) throw new Error();

        const data = await response.json();

        finalLink.value = data.shortUrl;
        resultArea.classList.remove("d-none");

        setupSharing(data.shortUrl, title);

    } catch {
        alert("Server error. Please try again.");
    }

    createBtn.innerHTML = "Create Short Link";
    createBtn.disabled = false;
}

function copyLink() {
    navigator.clipboard.writeText(finalLink.value);
}

function resetForm() {
    targetUrl.value = "";
    linkTitle.value = "";
    linkDesc.value = "";
    linkImg.value = "";
    resultArea.classList.add("d-none");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function setupSharing(url, title) {
    shareWa.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(title + " " + url)}`;
    shareFb.href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
    shareX.href = `https://x.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`;
    shareTg.href = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
}
</script>

</body>
</html>
